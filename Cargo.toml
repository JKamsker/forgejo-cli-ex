[package]
name = "forgejo-cli-ex"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "fj-ex"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.34", features = ["derive"] }
directories = "6.0.0"
eyre = "0.6.12"
git2 = "0.20.1"
html-escape = "0.2.13"
cookie = "0.18.1"
cookie_store = "0.22.1"
regex = "1.12.2"
reqwest = { version = "0.13.2", default-features = false, features = ["brotli", "cookies", "deflate", "form", "gzip", "json", "rustls", "stream"] }
reqwest_cookie_store = "0.10.0"
rpassword = "7.4.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
time = { version = "0.3.41", features = ["formatting", "parsing"] }
tokio = { version = "1.44.1", features = ["full"] }
url = "2.5.4"
urlencoding = "2.1.3"
