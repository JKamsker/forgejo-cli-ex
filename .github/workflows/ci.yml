name: ci

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --check

  test:
    needs: fmt
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: cargo test --locked

  e2e:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run ignored e2e tests (Docker + Forgejo)
        env:
          FJ_EX_E2E: "1"
        run: cargo test --locked --test e2e_forgejo_docker -- --ignored --test-threads=1

  publish:
    needs: [test, e2e]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    concurrency:
      group: crates-io-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Bump version (if needed) + publish to crates.io
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "${CARGO_REGISTRY_TOKEN:-}" ]]; then
            echo "CARGO_REGISTRY_TOKEN is not set; skipping crates.io publish."
            exit 0
          fi

          meta="$(cargo metadata --no-deps --format-version=1)"
          crate="$(jq -r '.packages[0].name' <<<"$meta")"
          version="$(jq -r '.packages[0].version' <<<"$meta")"

          echo "crate=$crate current_version=$version"

          publish_out="$(cargo publish --locked 2>&1)" && { echo "$publish_out"; exit 0; }

          if echo "$publish_out" | grep -qiE "already (uploaded|exists)|is already uploaded|version.*already"; then
            echo "Current version already exists on crates.io; will bump patch and publish."
          else
            echo "$publish_out"
            exit 1
          fi

          next_version="$(
            CURRENT_VERSION="$version" python - <<'PY'
          import os, re
          def parse(v: str):
              m = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)", v)
              if not m:
                  raise SystemExit(f"Unsupported version (expected X.Y.Z): {v}")
              return tuple(map(int, m.groups()))
          cur = os.environ["CURRENT_VERSION"]
          maj, min_, patch = parse(cur)
          print(f"{maj}.{min_}.{patch+1}")
          PY
          )"

          echo "Bumping patch version: $version -> $next_version"

          NEW_VERSION="$next_version" python - <<'PY'
          import os, re, pathlib
          path = pathlib.Path("Cargo.toml")
          text = path.read_text(encoding="utf-8")
          lines = text.splitlines(True)
          out = []
          in_pkg = False
          done = False
          for line in lines:
              if re.match(r"^\[package\]\s*$", line):
                  in_pkg = True
                  out.append(line)
                  continue
              if in_pkg and re.match(r"^\[", line):
                  in_pkg = False
              if in_pkg and not done and re.match(r'^\s*version\s*=\s*"[^"]+"\s*(#.*)?$', line):
                  indent = re.match(r"^(\s*)version\s*=.*$", line).group(1)
                  out.append(f'{indent}version = "{os.environ["NEW_VERSION"]}"\n')
                  done = True
                  continue
              out.append(line)
          if not done:
              raise SystemExit("Failed to update Cargo.toml version in [package] section")
          path.write_text("".join(out), encoding="utf-8")
          PY

          CRATE_NAME="$crate" NEW_VERSION="$next_version" python - <<'PY'
          import os, re, pathlib
          crate = os.environ["CRATE_NAME"]
          new_version = os.environ["NEW_VERSION"]

          path = pathlib.Path("Cargo.lock")
          text = path.read_text(encoding="utf-8")
          lines = text.splitlines(True)

          out = []
          in_pkg = False
          is_target = False
          done = False

          for line in lines:
              if line.strip() == "[[package]]":
                  in_pkg = True
                  is_target = False
                  out.append(line)
                  continue

              if in_pkg and not is_target:
                  m = re.match(r'^name\s*=\s*"([^"]+)"\s*$', line)
                  if m and m.group(1) == crate:
                      is_target = True
                      out.append(line)
                      continue

              if in_pkg and is_target and not done:
                  if re.match(r'^version\s*=\s*"[^"]+"\s*$', line):
                      indent = re.match(r"^(\s*)version\s*=.*$", line).group(1)
                      out.append(f'{indent}version = "{new_version}"\n')
                      done = True
                      continue

              out.append(line)

          if not done:
              raise SystemExit(f"Failed to update Cargo.lock version for {crate}")

          path.write_text("".join(out), encoding="utf-8")
          PY

          git diff -- Cargo.toml Cargo.lock

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Cargo.toml Cargo.lock
          git commit -m "chore(release): bump version to ${next_version}"
          git push origin HEAD:master

          echo "Publishing $crate v$next_version"
          cargo publish --locked
