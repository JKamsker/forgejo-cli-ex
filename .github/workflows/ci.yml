name: ci

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --check

  test:
    needs: fmt
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: cargo test --locked

  publish:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    concurrency:
      group: crates-io-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Bump version (if needed) + publish to crates.io
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "${CARGO_REGISTRY_TOKEN:-}" ]]; then
            echo "CARGO_REGISTRY_TOKEN is not set; skipping crates.io publish."
            exit 0
          fi

          meta="$(cargo metadata --no-deps --format-version=1)"
          crate="$(jq -r '.packages[0].name' <<<"$meta")"
          version="$(jq -r '.packages[0].version' <<<"$meta")"

          echo "crate=$crate current_version=$version"

          http_code="$(
            curl -sS -o crates.json -w "%{http_code}" "https://crates.io/api/v1/crates/${crate}" || true
          )"

          if [[ "$http_code" != "200" && "$http_code" != "404" ]]; then
            echo "Unexpected response from crates.io: HTTP $http_code"
            cat crates.json || true
            exit 1
          fi

          published="false"
          max_version=""
          if [[ "$http_code" == "200" ]]; then
            published="$(jq -r --arg v "$version" '[.versions[].num] | index($v) != null' crates.json)"
            max_version="$(jq -r '.crate.max_version' crates.json)"
          fi

          if [[ "$published" != "true" ]]; then
            echo "Publishing $crate v$version"
            cargo publish --locked
            exit 0
          fi

          next_version="$(
            CURRENT_VERSION="$version" PUBLISHED_MAX_VERSION="$max_version" python - <<'PY'
          import os, re
          def parse(v: str):
              m = re.fullmatch(r"(\\d+)\\.(\\d+)\\.(\\d+)", v)
              if not m:
                  raise SystemExit(f"Unsupported version (expected X.Y.Z): {v}")
              return tuple(map(int, m.groups()))
          cur = os.environ["CURRENT_VERSION"]
          pub = os.environ.get("PUBLISHED_MAX_VERSION") or cur
          base = max(parse(cur), parse(pub))
          maj, min_, patch = base
          print(f"{maj}.{min_}.{patch+1}")
          PY
          )"

          echo "Bumping patch version: $version -> $next_version"

          NEW_VERSION="$next_version" python - <<'PY'
          import os, re, pathlib
          path = pathlib.Path("Cargo.toml")
          text = path.read_text(encoding="utf-8")
          lines = text.splitlines(True)
          out = []
          in_pkg = False
          done = False
          for line in lines:
              if re.match(r"^\\[package\\]\\s*$", line):
                  in_pkg = True
                  out.append(line)
                  continue
              if in_pkg and re.match(r"^\\[", line):
                  in_pkg = False
              if in_pkg and not done and re.match(r"^\\s*version\\s*=\\s*\"[^\"]+\"\\s*(#.*)?$", line):
                  indent = re.match(r"^(\\s*)version\\s*=.*$", line).group(1)
                  out.append(f'{indent}version = \"{os.environ[\"NEW_VERSION\"]}\"\\n')
                  done = True
                  continue
              out.append(line)
          if not done:
              raise SystemExit("Failed to update Cargo.toml version in [package] section")
          path.write_text("".join(out), encoding="utf-8")
          PY

          git diff -- Cargo.toml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Cargo.toml
          git commit -m "chore(release): bump version to ${next_version}"
          git push origin HEAD:master

          echo "Publishing $crate v$next_version"
          cargo publish --locked
